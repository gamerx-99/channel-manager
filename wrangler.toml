# Cloudflare Worker for hayhost (spec 13). The top level is local `wrangler dev`;
# deploy with `--env staging` or `--env production`. Bindings are not inherited
# by environments, so each one repeats them.
name = "hayhost-dev"
main = "worker/index.ts"
compatibility_date = "2026-10-20"
# nodejs_compat also fills process.env from vars and secrets, which server/ reads.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hayhost-dev"
# Local-only id; `wrangler dev` keeps the data in .wrangler/state.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/d1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hayhost-media-dev"

# Public booking writes (channelManager.holdRoomType / confirmBookingDetails), keyed by
# CF-Connecting-IP. Each environment has its own namespace_id so counters never mix.
[[ratelimits]]
name = "PUBLIC_BOOKING_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[env.staging]
name = "hayhost-stage"
workers_dev = true

# NODE_ENV=production keeps tRPC from returning stack traces to clients.
[env.staging.vars]
NODE_ENV = "production"
PUBLIC_APP_URL = "https://hayhost-stage.lannatc.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "hayhost-staging"
database_id = "f7fb735d-59a0-4a56-a8b4-bacb654d53d7"
migrations_dir = "drizzle/d1"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "hayhost-media-staging"

[[env.staging.ratelimits]]
name = "PUBLIC_BOOKING_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[env.staging.triggers]
crons = ["*/15 * * * *"]

[env.production]
name = "hayhost"
workers_dev = false
# Custom Domain: wrangler deploy --env production creates the DNS record and certificate.
# The apex hayhostth.com is left to a dashboard Redirect Rule to www.
routes = [{ pattern = "www.hayhostth.com", custom_domain = true }]

[env.production.vars]
NODE_ENV = "production"
PUBLIC_APP_URL = "https://www.hayhostth.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "hayhost-production"
# Replace with the id printed by `wrangler d1 create hayhost-production`.
database_id = "97f19e0b-d3f1-4b08-9abf-7992600a6bd3"
migrations_dir = "drizzle/d1"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "hayhost-media"

[[env.production.ratelimits]]
name = "PUBLIC_BOOKING_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[env.production.triggers]
crons = ["*/15 * * * *"]
